# Directories "idea <name>" and "proj <name>" search for a git repo whose
# path matches <name> as a substring.
export INTELLIJ_IDEA_SEARCH_ROOTS=(
	"${HOME}/git/molex"
	"${HOME}/git/other"
	"${HOME}/git/lfeagan"
	"${HOME}/git/flow-test"
)

# How many directory levels below each search root to look.
export INTELLIJ_IDEA_SEARCH_DEPTH=6

# Application "idea" opens matches with (resolved via "open -a", so an exact
# install path isn't needed). Change if you use a different JetBrains IDE
# (e.g. "PyCharm Professional", "WebStorm") for these repos.
export INTELLIJ_IDEA_APP="IntelliJ IDEA"
